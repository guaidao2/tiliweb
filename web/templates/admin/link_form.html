{{define "content"}}
<section class="admin-page">
  <div class="page-head"><div><p class="eyebrow">站点</p><h1>{{if .FriendLink.ID}}编辑友情链接{{else}}新建友情链接{{end}}</h1></div><a class="button ghost" href="{{.BasePath}}{{.AdminPath}}/links">返回</a></div>
  {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
  <form class="form" method="post" action="{{.BasePath}}{{.AdminPath}}/links/{{if .FriendLink.ID}}{{.FriendLink.ID}}/edit{{else}}new{{end}}">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label>名称 <input name="name" value="{{.FriendLink.Name}}" required></label>
    <label>URL <input name="url" value="{{.FriendLink.URL}}" placeholder="https://example.com" required></label>
    <label>Logo 媒体 ID <input type="number" name="logo_media_id" value="{{.FriendLink.LogoMediaID}}"></label>
    <label>排序 <input type="number" name="sort_order" value="{{.FriendLink.SortOrder}}"></label>
    <label><span><input type="checkbox" name="enabled" value="1" {{if .FriendLink.Enabled}}checked{{end}}> 启用</span></label>
    <button class="button" type="submit">保存友情链接</button>
  </form>
</section>
{{end}}
