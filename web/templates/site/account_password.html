{{define "content"}}
<section class="auth">
  <p class="eyebrow">账户</p>
  <h1>修改密码</h1>
  {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
  <form class="form" method="post" action="{{.BasePath}}/account/password">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label>当前密码
      <input type="password" name="current_password" autocomplete="current-password" required autofocus>
    </label>
    <label>新密码
      <input type="password" name="new_password" autocomplete="new-password" required minlength="10">
    </label>
    <button class="button" type="submit">更新密码</button>
  </form>
  <p class="muted"><a href="{{.BasePath}}/account">返回个人中心</a></p>
</section>
{{end}}
