name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then version="1.0.0"; fi
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bin="tiliweb"
          if [ "$GOOS" = "windows" ]; then bin="tiliweb.exe"; fi
          mkdir -p dist/package
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X tiliweb/internal/version.Version=${version} -X tiliweb/internal/version.Commit=${GITHUB_SHA} -X tiliweb/internal/version.BuildDate=${build_date}" \
            -o "dist/package/${bin}" ./cmd/tiliweb
          cp README.md LICENSE config.example.yaml dist/package/
          cp -R deploy dist/package/
          name="tiliweb-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            (cd dist/package && zip -qr "../${name}.zip" .)
          else
            tar -czf "dist/${name}.tar.gz" -C dist/package .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tiliweb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: tiliweb ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
